spring.application.name=michiru-invoice-api

# In-memory H2 for zero-config local runs (demo)
spring.datasource.url=jdbc:h2:mem:invoicedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 console available at /h2-console (JDBC URL: jdbc:h2:mem:invoicedb)
spring.h2.console.enabled=true

server.port=8080

management.endpoints.web.exposure.include=health,info

# Reminder automation (workflow automation demo)
app.automation.enabled=true
app.automation.cron=0 0 */6 * * *
app.automation.reminder-days-before-due=2
app.automation.reminder-gap-days=3
